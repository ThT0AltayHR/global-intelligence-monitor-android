name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore GlobalIntelligenceMonitor.csproj

      - name: Publish APK
        run: dotnet publish GlobalIntelligenceMonitor.csproj -f net8.0-android -c Release -p:AndroidPackageFormat=apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalIntelligenceMonitor-APK
          path: bin/Release/net8.0-android/*.apk